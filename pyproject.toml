[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ironwise"
version = "0.1.1"
description = "Self-hosted, <=7GB LLM system for finance data processing: ingestion, governed NL-to-SQL, reconciliation and variance analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ironwise contributors" }]
dependencies = [
  "pydantic>=2.6",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "starlette>=0.37",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "bandit>=1.7", "pip-audit>=2.7"]
train = ["torch>=2.3", "transformers>=4.44", "peft>=0.12", "datasets>=2.20", "trl>=0.10"]

[project.scripts]
ironwise = "ironwise.cli:main"

[tool.setuptools.packages.find]
include = ["ironwise*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]  # asserts are fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
